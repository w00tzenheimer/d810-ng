name: d810-ng tests

on:
    push:
        branches: ["main", "cfg-recon-mainline"]
    pull_request:
        types: [synchronize, opened, reopened, ready_for_review]
        branches: ["main", "cfg-recon-mainline"]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ast-grep:
        name: "ast-grep"
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
            - name: Install ast-grep
              run: |
                  npm install -g @ast-grep/cli@0.42.3
            - name: Run ast-grep rule fixtures
              run: |
                  sg test --config sgconfig.yml --test-dir rule-tests
            - name: Run ast-grep rules
              run: |
                  sg scan --config sgconfig.yml --report-style short

            - name: Portable-core shape-lint gate (warning-mode ratchet)
              run: |
                  python3 tools/scripts/portable_shape_lint_gate.py

    unit-tests:
        name: "unit-tests (py${{ matrix.python-version }})"
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                python-version: ["3.11", "3.12", "3.13"]
        env:
            PYTHONPATH: ${{ github.workspace }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip
            - name: Install LLVM opt
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq llvm
                  echo "LLVM_OPT=$(command -v opt)" >> "$GITHUB_ENV"
                  opt --version
            - name: Install dependencies
              run: |
                  pip install --upgrade pip setuptools wheel uv
                  uv pip install --system -e ".[emulation]"
                  uv pip install --system "z3-solver>=4.13,<4.15.5"
                  uv pip install --system pytest pytest-cov import-linter vermin libcst

            - name: Install repo-local speedups helper
              run: |
                  python -m d810.speedups.install --solver-only
            - name: Check import boundaries
              run: |
                  PYTHONPATH=src lint-imports --config .importlinter
            - name: Check Python version compatibility
              if: contains(fromJSON('["3.11", "3.12"]'), matrix.python-version)
              run: |
                  python tools/check-python-versions
            - name: Check borrowed mop_t patterns
              run: |
                  pip install ast-grep-cli
                  sg scan --rule rules/no-borrowed-mop-storage.yml
            - name: Run pytest
              run: |
                  pytest tests/unit/ -v --tb=short

    build-speedups:
        name: "speedups (py${{ matrix.python-version }}, ${{ matrix.os }})"
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04]
                python-version: ["3.11", "3.12", "3.13"]
        env:
            PYTHONPATH: ${{ github.workspace }}
            D810_BUILD_SPEEDUPS: "1"
            IDA_SDK: ${{ github.workspace }}/.ida-sdk
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}
                  cache: pip

            - name: Install build dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq llvm
                  echo "LLVM_OPT=$(command -v opt)" >> "$GITHUB_ENV"
                  opt --version
                  pip install --upgrade pip setuptools wheel uv
                  uv pip install --system Cython>=3.0.0

            - name: Ensure IDA SDK
              uses: ./.github/actions/ensure-ida-sdk
              with:
                sdk-dir: .ida-sdk
                ref: 7f8fd3100142295bffa5eabb2ce6f5b5ac163c6b

            - name: Build with Cython speedups
              run: |
                  uv pip install --system --no-build-isolation -e ".[speedups,emulation]"

            - name: Install repo-local speedups helper
              run: |
                  python -m d810.speedups.install

            - name: Verify speedups installed
              run: |
                  python -c "from d810.speedups import cythxr; print('Cython speedups available')" || echo "Speedups not built (expected if compile failed)"

            - name: Install test dependencies
              run: |
                  uv pip install --system pytest pytest-cov libcst

            - name: Run pytest
              run: |
                  pytest tests/unit/ -v --tb=short

    system-tests:
        name: "system-tests (idapro-9.4, pure-python)"
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 360
        env:
            D810_DOCKER_IMAGE: ghcr.io/w00tzenheimer/idapro-9.4-speedups:x11
            D810_DOCKER_MEMORY: 4g
            D810_NO_CYTHON: "1"
        steps:
            - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_TOKEN }}

            - name: Pull IDA 9.4 ARM64 runtime
              run: |
                  docker pull "$D810_DOCKER_IMAGE"
                  test "$(docker image inspect "$D810_DOCKER_IMAGE" --format '{{.Architecture}}')" = arm64

            - name: Run system tests through the canonical harness
              run: ./tools/scripts/run_system_tests_docker.sh system --shards 3 -- -q

    system-tests-speedups:
        name: "system-tests (idapro-9.4, speedups)"
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 360
        env:
            D810_DOCKER_IMAGE: ghcr.io/w00tzenheimer/idapro-9.4-speedups:x11
            D810_DOCKER_MEMORY: 4g
            D810_NO_CYTHON: "0"
        steps:
            - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
              uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GHCR_TOKEN }}

            - name: Pull IDA 9.4 ARM64 runtime
              run: |
                  docker pull "$D810_DOCKER_IMAGE"
                  test "$(docker image inspect "$D810_DOCKER_IMAGE" --format '{{.Architecture}}')" = arm64

            - name: Build current speedups and run system tests through the canonical harness
              run: ./tools/scripts/run_system_tests_docker.sh system --shards 3 -- -q
