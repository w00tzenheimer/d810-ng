name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag name (e.g. v1.2.3). If empty, uses the current ref."
                required: false
                default: ""

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Resolve tag
              id: version
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REQUESTED_TAG: ${{ github.event.inputs.tag }}
                  CURRENT_REF: ${{ github.ref }}
              run: |
                  REF="$CURRENT_REF"
                  if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$REQUESTED_TAG" ]; then
                    if [[ "$REQUESTED_TAG" == refs/* ]]; then
                      REF="$REQUESTED_TAG"
                    else
                      REF="refs/tags/$REQUESTED_TAG"
                    fi
                  fi
                  TAG="${REF#refs/tags/}"
                  if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z.!+_-]*$ ]]; then
                    echo "Expected a version tag beginning with v" >&2
                    exit 1
                  fi
                  {
                    echo "ref=$REF"
                    echo "tag=$TAG"
                    echo "version=${TAG#v}"
                  } >> "$GITHUB_OUTPUT"

            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ steps.version.outputs.ref }}
                  persist-credentials: false

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install version parser
              run: python -m pip install packaging

            - name: Record release source
              id: source
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
              run: |
                  python - <<'PYCODE'
                  import ast
                  import json
                  import os
                  import re
                  import subprocess
                  from pathlib import Path
                  from packaging.version import Version

                  tag = os.environ["RELEASE_TAG"]
                  if not re.fullmatch(r"v[0-9][0-9A-Za-z.!+_-]*", tag):
                      raise SystemExit("Expected a version tag beginning with v")
                  version = Version(tag[1:])
                  tree = ast.parse(Path("src/d810/__init__.py").read_text())
                  package_version = next(
                      ast.literal_eval(node.value)
                      for node in tree.body if isinstance(node, ast.Assign)
                      if any(isinstance(target, ast.Name) and target.id == "__version__"
                             for target in node.targets)
                  )
                  if version != Version(package_version):
                      raise SystemExit("Release tag does not match package version")
                  sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
                  tagged = subprocess.check_output(
                      ["git", "rev-parse", f"refs/tags/{tag}^{{commit}}"], text=True
                  ).strip()
                  if tagged != sha:
                      raise SystemExit("Release tag does not match checked-out commit")
                  Path(".release-source").mkdir(exist_ok=True)
                  Path(".release-source/receipt.json").write_text(
                      json.dumps({"tag": tag, "sha": sha}) + "\n"
                  )
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"prerelease={str(version.is_prerelease).lower()}\n")
                  PYCODE

            - uses: actions/upload-artifact@v4
              with:
                  name: release-source
                  path: .release-source/receipt.json
                  include-hidden-files: true
                  if-no-files-found: error

            - name: Skip if release already exists
              id: guard
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "already=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "already=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}

            - name: Create GitHub Release
              if: steps.guard.outputs.already == 'false'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: ${{ steps.version.outputs.tag }}
                  draft: false
                  generate_release_notes: true
                  prerelease: ${{ steps.source.outputs.prerelease }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
