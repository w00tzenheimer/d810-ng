name: Build and upload to PyPI

on:
    workflow_dispatch:
    release:
        types:
            - published
    workflow_run:
        workflows: ["Release"]
        types:
            - completed

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

permissions:
    contents: read
    actions: read

jobs:
    build_wheels:
        if: >-
            github.event_name != 'workflow_run' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == github.repository)
        name: Build wheels for ${{ matrix.os }}
        runs-on: ${{ matrix.runs-on }}
        env:
            IDA_SDK: ${{ github.workspace }}/.ida-sdk
        strategy:
            matrix:
                include:
                    - os: linux-intel
                      runs-on: ubuntu-latest
                    - os: windows-intel
                      runs-on: windows-latest
                    - os: macos-intel
                      runs-on: macos-15-intel
                    - os: macos-arm
                      runs-on: macos-latest

        steps:
            - name: Download release source
              if: github.event_name == 'workflow_run'
              uses: actions/download-artifact@v4
              with:
                  name: release-source
                  path: .release-source
                  run-id: ${{ github.event.workflow_run.id }}
                  repository: ${{ github.repository }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve source
              id: source
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  EVENT_SHA: ${{ github.sha }}
              run: |
                  python - <<'PYCODE'
                  import json
                  import os
                  import re
                  from pathlib import Path

                  if os.environ["EVENT_NAME"] == "workflow_run":
                      receipt = json.loads(Path(".release-source/receipt.json").read_text())
                      if not isinstance(receipt, dict) or set(receipt) != {"tag", "sha"}:
                          raise SystemExit("Invalid release source receipt")
                      tag = receipt["tag"]
                      if not isinstance(tag, str) or not re.fullmatch(r"v[0-9][0-9A-Za-z.!+_-]*", tag):
                          raise SystemExit("Invalid release tag")
                      sha = receipt["sha"]
                  else:
                      sha = os.environ["EVENT_SHA"]
                  if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                      raise SystemExit("Invalid release commit")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"sha={sha}\n")
                  PYCODE

            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.source.outputs.sha }}
                  persist-credentials: false

            - name: Ensure IDA SDK
              uses: ./.github/actions/ensure-ida-sdk
              with:
                sdk-dir: .ida-sdk
                ref: 7f8fd3100142295bffa5eabb2ce6f5b5ac163c6b

            - name: Build wheels
              uses: pypa/cibuildwheel@v3.1
              env:
                  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
                  # IDA SDK is 64-bit only — skip 32-bit wheels
                  CIBW_SKIP: "*-win32 *-musllinux_*"
                  # Enable optional Cython speedups during wheel build.
                  CIBW_ENVIRONMENT: "D810_BUILD_SPEEDUPS=1"
                  CIBW_BEFORE_BUILD: "pip install Cython>=3.0.0"
                  # Report every backend with a reason for any that is not
                  # usable and verify the wheel's native speedups. Optional
                  # backends now ship as their own distributions (d810-cobra),
                  # so an absent one is expected rather than a build failure.
                  #
                  # A defect IS fatal: BROKEN or INCOMPATIBLE means a backend
                  # this wheel claims to carry is mis-declared, which would
                  # otherwise reach PyPI silently.
                  CIBW_TEST_COMMAND: >-
                      python "{project}/tools/verify_release_wheel.py"
              with:
                  package-dir: .
                  output-dir: wheelhouse
                  config-file: "{package}/pyproject.toml"

            - uses: actions/upload-artifact@v4
              with:
                  name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                  path: ./wheelhouse/*.whl

    upload_to_pypi:
        needs: [build_wheels]
        runs-on: ubuntu-latest
        name: Upload to PyPI
        permissions:
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  pattern: cibw-*
                  path: dist
                  merge-multiple: true

            - name: Display downloaded files
              run: |
                  ls -shR dist/

            - uses: pypa/gh-action-pypi-publish@release/v1
              if: >-
                  (github.repository_owner == 'w00tzenheimer' ||
                  github.repository_owner == 'mahmoudimus') && (
                  (github.event_name == 'release' && github.event.action == 'published') ||
                  (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
                  github.event_name == 'workflow_dispatch')
              with:
                  skip-existing: true
