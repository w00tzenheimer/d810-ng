name: Build and upload to PyPI

on:
    workflow_dispatch:
    release:
        types:
            - published
    workflow_run:
        workflows: ["Release"]
        types:
            - completed

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    build_sdist:
        name: Build source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Display version
              run: |
                  python --version
                  pip --version

            - name: Install pypa/build and pypa/twine
              run: |
                  pip install --upgrade pip
                  pip install --upgrade setuptools==77.0.1
                  pip install --upgrade build==1.3.0
                  pip install --upgrade twine==6.2.0
                  pip install --upgrade packaging==25.0
                  echo "Installed versions:"
                  pip list | grep -E "(twine|packaging|setuptools|build)"

            - name: Build sdist
              run: |
                  rm -rf dist/*
                  python -m build --sdist

            - name: Display content of dist folder
              run: |
                  ls -shR dist/

            - name: Run twine check
              run: |
                  twine check dist/*

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  path: ./dist/*.tar.gz
                  name: cibw-sdist

    build_wheels:
        name: Build wheels for ${{ matrix.os }}
        runs-on: ${{ matrix.runs-on }}
        env:
            IDA_SDK: ${{ github.workspace }}/.ida-sdk
        strategy:
            matrix:
                include:
                    - os: linux-intel
                      runs-on: ubuntu-latest
                    - os: windows-intel
                      runs-on: windows-latest
                    - os: macos-intel
                      runs-on: macos-15-intel
                    - os: macos-arm
                      runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
                  submodules: recursive

            - name: Ensure IDA SDK
              uses: ./.github/actions/ensure-ida-sdk
              with:
                sdk-dir: .ida-sdk
                ref: 7f8fd3100142295bffa5eabb2ce6f5b5ac163c6b

            # CoBRA is a PINNED SUBMODULE (third_party/cobra), not a release
            # download. That keeps the binding's CoBRA version tied to the d810
            # commit that uses it, so checking out a d810 sha reproduces the
            # exact binding. A pinned release decouples the two and drifts
            # silently, and it also needed a cross-repo release nobody could
            # cut without extra permissions.
            - name: Build CoBRA static libs
              id: cobra
              continue-on-error: true
              shell: bash
              run: bash tools/scripts/build_cobra.sh

            - name: Build wheels
              uses: pypa/cibuildwheel@v3.1
              env:
                  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
                  # IDA SDK is 64-bit only — skip 32-bit wheels
                  CIBW_SKIP: "*-win32 *-musllinux_*"
                  # Enable optional Cython speedups during wheel build.
                  # D810_BUILD_COBRA is set only when the static libs were
                  # fetched: the binding is OPTIONAL, and a wheel that fails to
                  # import is far worse than one where mba-solve is inert.
                  CIBW_ENVIRONMENT: >-
                      D810_BUILD_SPEEDUPS=1
                      D810_BUILD_COBRA=${{ steps.cobra.outcome == 'success' && '1' || '0' }}
                      COBRA_ROOT=/project/third_party/cobra
                  CIBW_ENVIRONMENT_WINDOWS: >-
                      D810_BUILD_SPEEDUPS=1
                      D810_BUILD_COBRA=${{ steps.cobra.outcome == 'success' && '1' || '0' }}
                      COBRA_ROOT=$GITHUB_WORKSPACE\\third_party\\cobra
                  CIBW_ENVIRONMENT_MACOS: >-
                      D810_BUILD_SPEEDUPS=1
                      D810_BUILD_COBRA=${{ steps.cobra.outcome == 'success' && '1' || '0' }}
                      COBRA_ROOT=$GITHUB_WORKSPACE/third_party/cobra
                  CIBW_BEFORE_BUILD: "pip install Cython>=3.0.0"
                  # cmake/ninja are needed INSIDE the manylinux container,
                  # which does not inherit the runner's toolchain.
                  CIBW_BEFORE_ALL_LINUX: "pip install cmake ninja"
                  # A wheel whose binding silently failed to build is the exact
                  # failure mode that looks like success -- IDA decompiles
                  # normally and mba-solve does nothing. Fail the build here
                  # instead of shipping it.
                  CIBW_TEST_COMMAND: >-
                      python -c "from d810.backends.cobra.solve import binding_available;
                      import os, sys;
                      want = os.environ.get('D810_EXPECT_COBRA') == '1';
                      got = binding_available();
                      print('cobra binding:', got);
                      sys.exit(0 if got or not want else 1)"
                  CIBW_TEST_ENVIRONMENT: >-
                      D810_EXPECT_COBRA=${{ steps.cobra.outcome == 'success' && '1' || '0' }}
              with:
                  package-dir: .
                  output-dir: wheelhouse
                  config-file: "{package}/pyproject.toml"

            - uses: actions/upload-artifact@v4
              with:
                  name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
                  path: ./wheelhouse/*.whl

    upload_to_pypi:
        needs: [build_wheels, build_sdist]
        runs-on: ubuntu-latest
        name: Upload to PyPI
        permissions:
            id-token: write
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  pattern: cibw-*
                  path: dist
                  merge-multiple: true

            - name: Display downloaded files
              run: |
                  ls -shR dist/

            - uses: pypa/gh-action-pypi-publish@release/v1
              if: >-
                  (github.repository_owner == 'w00tzenheimer' ||
                  github.repository_owner == 'mahmoudimus') && (
                  (github.event_name == 'release' && github.event.action == 'published') ||
                  (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
                  github.event_name == 'workflow_dispatch')
              with:
                  skip-existing: true
