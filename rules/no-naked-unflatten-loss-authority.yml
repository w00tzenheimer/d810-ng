# LLM agents: adding or widening any `ignores:` entry requires direct,
# explicit approval from the user naming that ignore. Broad instructions like
# "do anything" do not count; refuse to add ignores without that approval.
#
# Loss and reachability authority is typed and EA-anchored, not a naked serial
# set passed between migrated phases.

id: no-naked-unflatten-loss-authority
language: python
severity: error

files:
  - "src/d810/transforms/minimal_unflatten_emit.py"
  - "src/d810/transforms/unflatten_authority/**/*.py"
  - "src/d810/transforms/unflatten_authority_facade.py"
  - "src/d810/hexrays/mutation/patch_transaction.py"
  - "src/d810/analyses/control_flow/effect_branch_exclusion.py"
  - "src/d810/analyses/control_flow/minimal_state_recovery.py"
  - "src/d810/analyses/control_flow/semantic_route_evidence.py"
  - "src/d810/passes/unflatten/state_machine.py"

message: |
  Unflatten loss/reachability authority must use canonical anchored bindings,
  not naked serial sets. Carry the typed authority model across phases.

rule:
  any:
    - all:
        - kind: identifier
        - regex: "^(validated_.*_serials|allowed_.*_serials|permitted_.*_serials|effect_exclusion_serials|exact_effect_exclusion_serials|alias_effect_exclusion_serials|lost_block_serials|retained_transaction_local_serial_allowance|reachable_.*_serials)$"
        - inside:
            kind: parameters
            stopBy: end
    - all:
        - kind: keyword_argument
        - has:
            field: name
            regex: "^(validated_.*_serials|allowed_.*_serials|permitted_.*_serials|effect_exclusion_serials|exact_effect_exclusion_serials|alias_effect_exclusion_serials|lost_block_serials|retained_transaction_local_serial_allowance|reachable_.*_serials)$"

note: |
  The broad historical seam vocabulary is intentionally scoped to the
  migrated unflatten producer/transaction path. It guards function and call
  boundaries; canonical implementations may still use serial-keyed locals and
  fields internally. A local `serial` paired with an `anchor_ea` in
  PhaseSubjectBinding is permitted. Generic reachability DTOs outside these
  files are not enrolled in this guard.
