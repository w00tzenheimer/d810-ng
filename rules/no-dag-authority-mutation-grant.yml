# LLM agents: adding or widening any `ignores:` entry requires direct,
# explicit approval from the user naming that ignore. Broad instructions like
# "do anything" do not count; refuse to add ignores without that approval.
#
# d81-9q6e. DagAuthority may restrict which proposals are emitted; it must
# never independently grant final mutation or semantic-loss permission. The
# arbiter is a query interface over a finalized LinearizedStateDag: it answers
# "does the DAG commit this source to this target?" and nothing else.

id: no-dag-authority-mutation-grant
language: python
severity: error

files:
  - "src/d810/transforms/dag_authority.py"
  - "src/d810/transforms/fragment_arbitration.py"

message: |
  DagAuthority is a restricting arbiter, not a granting one. Do not give it
  apply/commit/authorize/certify/emit/mutate/rewrite/receipt/transaction or
  semantic-loss API, and do not let the fragment arbitration filter construct
  a graph modification. Return a DagDecision and let the transaction authority
  own the grant.

  An ALLOW verdict has exactly ONE construction site: the DAG-edge-backed
  helper `DagAuthority._allow_from_dag_edge(edge, *, mod_kind)`, which takes
  the authorising StateDagEdge as a parameter. Build your verdict there or
  return DagDecision.gap(...) / DagDecision.refuse(...). Calling
  DagDecision.allow(...) anywhere else grants without naming the DAG edge that
  earned it -- that is exactly how permits_zero_state_write,
  permits_edge_redirect_via_pred_split and
  permits_dead_block_terminator_redirect each acquired a latent grant
  (aa-v8et).

rule:
  any:
    # A grant-shaped public method or attribute on the arbiter itself.
    - all:
        - kind: function_definition
        - has:
            field: name
            all:
              - kind: identifier
              - regex: "^(apply_(mod|mutation|patch|redirect|edit|change|transaction|to_)|authorize|authorise|certify|certifies|commit_|commit$|emit_|grant|mutate|rewrite_|permit_and_|[a-z][a-z0-9_]*(_receipt|_transaction|_grant|_semantic_loss))"
            stopBy: end
    # A field named like a mutation grant / receipt on the verdict or arbiter.
    - all:
        - kind: assignment
        - has:
            field: left
            all:
              - kind: identifier
              - regex: "^[a-z][a-z0-9_]*(_receipt|_transaction|_grant|_semantic_loss)$|^authorized_[a-z0-9_]+$"
        - inside:
            kind: class_definition
            stopBy: end
    # ALLOW must be earned from a DAG edge. `_allow_from_dag_edge` is the sole
    # permitted construction site, expressed structurally: the ban is lifted
    # only *inside* that helper, whose signature takes the edge as proof. This
    # is deliberately not an `ignores:` entry -- the exemption has to be
    # attached to the helper, not to a path.
    - all:
        - kind: call
        - has:
            field: function
            all:
              - kind: attribute
              - regex: "^DagDecision\\.allow$"
        - not:
            inside:
              kind: function_definition
              stopBy: end
              has:
                field: name
                kind: identifier
                regex: "^_allow_from_dag_edge$"
    # The arbitration filter must subtract, never construct a modification.
    - all:
        - kind: call
        - has:
            field: function
            all:
              - kind: identifier
              - regex: "^(RedirectGoto|ConvertToGoto|ZeroStateWrite|EdgeRedirectViaPredSplit|InsertBlock|DuplicateBlock|SplitBlock)$"

note: |
  Restrict-shaped vocabulary is what belongs here: `permits_*` methods,
  `DagDecision.refuse` / `.gap`, `canonical_target_for`,
  `conflicts_for_source`, and `apply_dag_conformance_gate` (which applies a
  *filter*, not a mutation). Those answer a question and are not matched;
  `apply_` is only enrolled when it is followed by a mutation noun.
  Private helpers (leading underscore) are not enrolled by the *name* clause.

  `DagDecision.allow` is the exception: the `permits_*` prefix is exempt from
  the name clause, so before aa-v8et a new `permits_whatever()` returning
  `DagDecision.allow(...)` passed this rule and the unit invariant alike. The
  allow-call clause closes that: it matches every `DagDecision.allow(...)`
  call that is not lexically inside `_allow_from_dag_edge`, the one helper
  that takes a StateDagEdge as its proof. `permits_*` methods stay exempt from
  the naming clause because they cannot construct an ALLOW at all.

  Consumers that need to act on a verdict live outside these two files and go
  through the centralized unflatten transaction authority.
